name: Auralis Android

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Bootstrap Android platform
        run: |
          if [ ! -f android/gradlew ]; then
            flutter create . --platforms=android --org com.auralis
          fi

      - name: Verify Auralis native bridge
        run: |
          test -f android/app/src/main/kotlin/com/auralis/audio/MainActivity.kt

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auralis-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
