name: Auralis Android

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: stable
          version: latest
          cache: true
          cache-sdk: true

      - name: Bootstrap generated Android project
        run: |
          if [ ! -f android/gradlew ]; then
            mkdir -p /tmp/auralis_native
            cp android/app/src/main/kotlin/com/auralis/audio/MainActivity.kt /tmp/auralis_native/MainActivity.kt
            rm -rf /tmp/auralis_android
            flutter create /tmp/auralis_android --platforms=android --org com.auralis --project-name audio
            rm -rf android
            cp -R /tmp/auralis_android/android ./android
            mkdir -p android/app/src/main/kotlin/com/auralis/audio
            cp /tmp/auralis_native/MainActivity.kt android/app/src/main/kotlin/com/auralis/audio/MainActivity.kt
          fi

      - name: Configure microphone permission
        run: |
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); permission="    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n"; s=s if "android.permission.RECORD_AUDIO" in s else s.replace("<application", permission + "    <application", 1); p.write_text(s.replace("android:name=\".MainActivity\"", "android:name=\"com.auralis.audio.MainActivity\""))'
          test -f android/app/src/main/kotlin/com/auralis/audio/MainActivity.kt

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: auralis-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
